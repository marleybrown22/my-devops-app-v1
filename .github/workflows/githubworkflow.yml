name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: my-devops-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: my-devops-app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    # Deploy on pushes to master or manual runs; never on pull requests.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
      - name: Redeploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/app
            if [ ! -d /opt/app/.git ]; then
              sudo git clone --depth 1 https://github.com/${{ github.repository }} /opt/app
            fi
            cd /opt/app
            sudo git fetch --depth 1 origin master
            sudo git reset --hard origin/master
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found, installing..."
              if [ -r /etc/os-release ]; then
                . /etc/os-release
                echo "Remote OS: ${PRETTY_NAME:-unknown}"
              fi
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y docker.io
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y docker
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y docker
              elif command -v apk >/dev/null 2>&1; then
                sudo apk add --no-cache docker
              elif command -v zypper >/dev/null 2>&1; then
                sudo zypper install -y docker
              elif command -v curl >/dev/null 2>&1; then
                curl -fsSL https://get.docker.com | sudo sh
              elif command -v wget >/dev/null 2>&1; then
                sudo wget -qO- https://get.docker.com | sudo sh
              else
                echo "No supported package manager or installer available for Docker." >&2
                exit 1
              fi
              if command -v systemctl >/dev/null 2>&1; then
                sudo systemctl enable --now docker || sudo systemctl start docker || true
              elif command -v service >/dev/null 2>&1; then
                sudo service docker start || true
              fi
              if ! command -v docker >/dev/null 2>&1; then
                echo "Docker installation did not put docker on PATH." >&2
                exit 1
              fi
            fi
            sudo docker build -t my-devops-app:latest .
            sudo docker rm -f my-devops-app 2>/dev/null || true
            echo "Docker containers before starting replacement:"
            sudo docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}'
            port_containers="$(sudo docker ps -a --format '{{.ID}} {{.Ports}}' | awk '$0 ~ /(^|[,:])3000->|0\.0\.0\.0:3000->|\[::\]:3000->|:::3000->/ { print $1 }')"
            if [ -n "$port_containers" ]; then
              echo "Removing existing Docker container(s) publishing port 3000..."
              sudo docker rm -f $port_containers
            fi
            port_listener=""
            if command -v ss >/dev/null 2>&1; then
              port_listener="$(sudo ss -ltnp | awk '$4 ~ /:3000$/')"
            elif command -v netstat >/dev/null 2>&1; then
              port_listener="$(sudo netstat -ltnp 2>/dev/null | awk '$4 ~ /:3000$/')"
            fi
            if [ -n "$port_listener" ]; then
              echo "Port 3000 is still in use before starting the app:" >&2
              echo "$port_listener" >&2
              exit 1
            fi
            sudo docker run -d --name my-devops-app --restart=always \
              -p 3000:3000 my-devops-app:latest
            sudo docker image prune -f
            echo "Waiting for health check..."
            for i in $(seq 1 10); do
              if curl -fsS http://localhost:3000/health; then
                echo "Deploy healthy."
                exit 0
              fi
              sleep 3
            done
            echo "Health check failed after deploy" >&2
            exit 1
